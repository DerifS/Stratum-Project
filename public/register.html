<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente | Stratum Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Stratum<span class="gradient-text">Design</span></a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="glass-panel auth-form">
            <h2>Crea tu <span class="gradient-text">Cuenta</span></h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Accede a nuestro portal para gestionar tus proyectos.</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" class="modern-input" placeholder="Elige un nombre de usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="modern-input" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="password2">Confirmar Contraseña</label>
                    <input type="password" id="password2" name="password2" class="modern-input" placeholder="Vuelve a escribir la contraseña" required>
                </div>

                <button type="submit" class="btn btn-cta" style="width: 100%; margin-top: 10px;">Crear Cuenta</button>
                
                <p id="error-message" style="color: #ef4444; text-align: center; margin-top: 15px; min-height: 1em; font-size: 0.9rem;"></p>
            </form>

            <div class="auth-links">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión aquí</a>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
