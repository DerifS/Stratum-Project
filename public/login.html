<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Stratum Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">

    <!-- Navegación simple para poder volver -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Stratum<span class="gradient-text">Design</span></a>
        </div>
    </nav>

    <!-- Contenedor centrado con cristal -->
    <div class="auth-container">
        <div class="glass-panel auth-form">
            <h2>Portal de <span class="gradient-text">Clientes</span></h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Ingresa para gestionar tus proyectos.</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <!-- Aquí está la clase 'modern-input' que soluciona el cuadro blanco -->
                    <input type="text" id="username" name="username" class="modern-input" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="modern-input" required>
                </div>

                <button type="submit" class="btn btn-cta" style="width: 100%; margin-top: 10px;">Acceder al Portal</button>

                <p id="error-message" style="color: #ef4444; text-align: center; margin-top: 15px; min-height: 1em; font-size: 0.9rem;"></p>
            </form>

            <div class="auth-links">
                ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
            </div>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
